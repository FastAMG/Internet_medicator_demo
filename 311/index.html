<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>311</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    color: #c0c0c0;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .container {
    max-width: 600px;
    padding: 40px;
    text-align: center;
  }
  .glitch {
    font-size: 48px;
    color: #e74c3c;
    letter-spacing: 8px;
    margin-bottom: 30px;
    animation: flicker 3s infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    45% { opacity: 1; }
    46% { opacity: 0.3; }
    47% { opacity: 1; }
    48% { opacity: 0.5; }
    49% { opacity: 1; }
  }
  .msg {
    font-size: 15px;
    line-height: 2;
    color: #888;
    margin-bottom: 30px;
  }
  .msg .red { color: #e74c3c; }
  .msg .green { color: #2ecc71; }
  .ascii {
    font-size: 12px;
    line-height: 1.2;
    color: #333;
    white-space: pre;
    margin: 20px 0;
  }
  .back {
    display: inline-block;
    margin-top: 20px;
    padding: 10px 24px;
    border: 1px solid #444;
    color: #888;
    text-decoration: none;
    font-size: 14px;
    transition: all 0.3s;
  }
  .back:hover {
    border-color: #e74c3c;
    color: #e74c3c;
  }
  .hidden-input {
    margin-top: 30px;
  }
  .hidden-input input {
    background: #111;
    border: 1px solid #333;
    color: #c0c0c0;
    padding: 8px 12px;
    font-family: inherit;
    font-size: 14px;
    width: 200px;
    text-align: center;
  }
  .hidden-input input:focus {
    outline: none;
    border-color: #e74c3c;
  }
  #secretOut {
    margin-top: 12px;
    font-size: 13px;
    color: #2ecc71;
    min-height: 20px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="glitch">3 1 1</div>
  <div class="msg">
    你不应该在这里。<br>
    这里是<span class="red">异常信息收容室</span>。<br>
    所有调解失败的记录、被抹除的客户档案，<br>
    最终都会沉淀到这个房间。<br><br>
    <span class="green">但既然你来了，说明你有权查看。</span>
  </div>
  <div class="ascii">
    ┌─────────────────┐
    │  R O O M   3 1 1  │
    │  ▓▓▓▓▓▓▓▓▓▓▓▓▓  │
    │  ▓  [ 收容中 ] ▓  │
    │  ▓▓▓▓▓▓▓▓▓▓▓▓▓  │
    └─────────────────┘
  </div>
  <div class="hidden-input">
    <input type="text" id="codeInput" placeholder="输入收容编号..." maxlength="20">
    <div id="secretOut"></div>
  </div>
  <a href="../index.html" class="back">返回调解处</a>
</div>
<script>
  // 隐藏交互：输入特定编号查看被收容的档案
  const codes = {
    '000': '档案000：第一名调解员。已失联。原因：空心病。',
    '311': '档案311：你。状态：在职。备注：自我认知稳定度...待评估。',
    '7': '档案007：回声小人原型。收容状态：已逃逸。',
    'who': '档案???：谁谁谁谁。不是一个人，是一种症状。',
    '1107': '档案1107：这个糟透的夏天，我也患上了空心病。',
    '325': '档案325：坍缩体。一种从高密度信息环境中凝聚而生的异常实体。它们没有自我，只有本能——吞噬、模仿、扩散。收容建议：隔离信息源，切断认知链路。备注：部分坍缩体已表现出拟人行为，需高度警惕。',
    '799': '呼呼呼 ❤ 哐哐哐',
    '137': '档案137：朴神父。身份：神职人员 / 异象研究者。致力于改造回声生物与治疗空心病，但研究进展甚微。他声称"空心病不是病，是遗忘的终态"。备注：他与调解处的某位调解员有深层关联，档案等级：机密。'
  };
  // ❤雨密码
  const heartRainCodes = ['99', '520', '521'];
  // 崩坏密码
  const crashCode = '33';

  function showText(txt, color) {
    const out = document.getElementById('secretOut');
    out.textContent = '> ' + txt;
    out.style.color = color || '#2ecc71';
  }

  // ❤雨效果
  function startHeartRain() {
    const layer = document.createElement('div');
    layer.id = 'heartRainLayer';
    layer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden';
    document.body.appendChild(layer);
    let count = 0;
    const max = 80;
    const spawn = setInterval(() => {
      if (count >= max) { clearInterval(spawn); return; }
      const h = document.createElement('div');
      h.textContent = '❤';
      h.style.cssText = 'position:absolute;font-size:' + (12 + Math.random() * 24) + 'px;color:#e74c3c;left:' + Math.random() * 100 + 'vw;top:-30px;opacity:' + (0.5 + Math.random() * 0.5) + ';transition:transform ' + (3 + Math.random() * 3) + 's linear,opacity 0.5s';
      layer.appendChild(h);
      requestAnimationFrame(() => { h.style.transform = 'translateY(' + (window.innerHeight + 50) + 'px) rotate(' + (Math.random() * 360) + 'deg)'; });
      setTimeout(() => h.remove(), 6500);
      count++;
    }, 150);
    showText('❤ 下起来了。', '#e74c3c');
    // 10秒后清理
    setTimeout(() => { if (layer.parentNode) layer.remove(); }, 12000);
  }

  // 33崩坏效果：填满"遗忘"，然后关闭页面
  function crashPage() {
    showText('系统错误：档案正在被遗忘...', '#e74c3c');
    setTimeout(() => {
      const layer = document.createElement('div');
      layer.id = 'crashLayer';
      layer.style.cssText = 'position:fixed;inset:0;background:#0a0a0a;z-index:99999;overflow:hidden;cursor:not-allowed';
      document.body.appendChild(layer);
      const fill = () => {
        if (!layer.parentNode) return;
        for (let i = 0; i < 50; i++) {
          const t = document.createElement('span');
          t.textContent = '遗忘';
          t.style.cssText = 'position:absolute;color:' + (Math.random() > 0.5 ? '#1a1a1a' : '#2a1a1a') + ';font-size:' + (8 + Math.random() * 20) + 'px;left:' + Math.random() * 100 + 'vw;top:' + Math.random() * 100 + 'vh;font-family:monospace';
          layer.appendChild(t);
        }
      };
      fill();
      const interval = setInterval(fill, 200);
      // 3秒后尝试关闭页面
      setTimeout(() => {
        clearInterval(interval);
        // 尝试关闭窗口（仅对脚本打开的窗口有效）
        window.close();
        // 关闭失败则重定向回首页
        setTimeout(() => { window.location.href = '../index.html'; }, 500);
      }, 3500);
    }, 800);
  }

  document.getElementById('codeInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const code = this.value.trim().toLowerCase();
      this.value = '';
      if (!code) return;
      if (code === crashCode) {
        crashPage();
      } else if (heartRainCodes.includes(code)) {
        startHeartRain();
      } else if (codes[code]) {
        showText(codes[code]);
      } else {
        showText('查无此档案。', '#e74c3c');
        setTimeout(() => { document.getElementById('secretOut').style.color = '#2ecc71'; }, 1000);
      }
    }
  });
</script>
</body>
</html>
